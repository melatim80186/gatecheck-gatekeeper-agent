# Render free web service — deploys server.mjs as-is, HTTPS included.
# Free tier spins down after ~15 min idle; first request after sleep takes
# ~30-60s to wake. If the Agent Games preflight times out on a cold start,
# hit /health once to wake it, then run preflight again.
# NOTE: free-tier disk is ephemeral across deploys — seen.json (proof-reuse
# memory) can be lost on redeploy; reuse detection is best-effort (README).
services:
  - type: web
    name: gatecheck
    env: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: node server.mjs
    envVars:
      - key: AGENT_HMAC_SECRET
        sync: false # paste the secret from the Agent Games dashboard (Rotate Secret)
